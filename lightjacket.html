<!DOCTYPE html>
<html>
<head>
<title>Light Jacket</title>

<style>
body{
  background:#111;
  color:#e0e0e0;
  font-family:'Cascadia Code',monospace;
  text-align:center;
  margin:0;
}

/* ===== TITLE IMAGE ===== */

.page-title{
  width:100%;
  display:flex;
  justify-content:center;
  margin-top:40px;
}

.page-title img{
  width:min(80vw, 900px);
  height:auto;
  display:block;
  filter:drop-shadow(0 0 30px rgba(255,255,255,0.5));
}

/* ===== BUTTONS ===== */

button{
  padding:30px 60px;
  margin:20px;
  font-size:40px;
  border:none;
  border-radius:12px;
  cursor:pointer;
  color:white;
}

.red{background:red;}
.green{background:green;}
.blue{background:#007BFF;}
.rainbow{
  background:linear-gradient(90deg,red,orange,yellow,green,blue,indigo,violet);
}
.off{background:#555;}
.update{
  background:#222;
  border:1px solid #4CAF50;
  font-size:24px;
  padding:20px 40px;
}
.map{
  background:#FF7518;
  font-size:24px;
  padding:20px 40px;
}
.home{background:#4CAF50;}
.set{
  background:white;
  color:black;
  margin-top:5px;
}

/* ===== SLIDERS ===== */

input[type=range]{
  width:80%;
  margin-top:15px;
  -webkit-appearance:none;
  height:30px;
  background:#333;
  border-radius:15px;
  outline:none;
}
input[type=range]::-webkit-slider-thumb{
  -webkit-appearance:none;
  width:50px;
  height:50px;
  border-radius:50%;
  background:#4CAF50;
  cursor:pointer;
  margin-top:-10px;
}

/* ===== CONTROL BLOCK ===== */

.control-block{
  display:flex;
  flex-direction:column;
  align-items:center;
  width:100%;
}

/* ===== COLOR PICKER ===== */

#picker{
  display:block;
  margin:40px auto 10px auto;
  width:180px;
  height:120px;
}

/* ===== WAVE + JACK-O'-LANTERN POPUPS ===== */

#wavePopup,
#pumpkinPopup{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.75);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:999;
}

#wavePopupInner,
#pumpkinPopupInner{
  background:#222;
  padding:25px;
  border-radius:16px;
  border:1px solid #4CAF50;
  min-width:260px;
}

#wavePopupInner h2,
#pumpkinPopupInner h2{
  margin-top:0;
  margin-bottom:15px;
  color:#4CAF50;
}

#wavePopupInner label,
#pumpkinPopupInner label{
  display:block;
  margin:10px 0 5px 0;
}

#wavePopupInner input[type=color],
#pumpkinPopupInner input[type=color]{
  width:100%;
  height:50px;
  border:none;
  padding:0;
  background:none;
}

#wavePopupInner button,
#pumpkinPopupInner button{
  padding:15px 30px;
  margin:10px;
  font-size:18px;
  background:#000;
}

/* ===== MAP LEDS POPUP ===== */

#mapPopup{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.75);
  display:none;
  align-items:center;
  justify-content:center;
  z-index:999;
}

#mapPopupInner{
  background:#222;
  padding:25px;
  border-radius:16px;
  border:1px solid #FF7518;
  width:min(90vw, 500px);
  box-sizing:border-box;
}

#mapPopupInner h2{
  margin-top:0;
  color:#FF7518;
}

#ledNumber{
  font-size:60px;
  margin:10px 0;
}

#mapPopupInner input[type=range]{
  width:100%;
}

#mapPopupInner button{
  padding:15px 25px;
  margin:8px;
  font-size:22px;
  background:#000;
}

#mapPopupInner button.pick{
  background:#FF7518;
}

#faceList{
  margin-top:15px;
  font-size:18px;
  color:#aaa;
  word-break:break-word;
}
</style>
</head>

<body>

<div class="page-title">
  <img src="LIGHT.png" alt="LIGHT">
</div>

<div>
  <button class="home" onclick="location.href='index.html'">Home</button>
</div>

<!-- ===== EFFECT SELECT ===== -->

<div class="control-block">
  <label style="font-size:35px;margin-top:10px;color:#4CAF50;">
    Effect
  </label>
  <select id="effectSelect"
          onchange="selectEffect(this.value)"
          style="margin-top:10px;font-size:30px;padding:10px 20px;border-radius:10px;border:none;">
    <option value="none">None</option>
    <option value="shooting_star">Shooting Star</option>
    <option value="christmas">Christmas</option>
    <option value="sparkler">Sparkler</option>
    <option value="wave">Wave (2-color)</option>
    <option value="fire">Fire</option>
    <option value="confetti">Confetti</option>
    <option value="police">Police</option>
    <option value="heartbeat">Heartbeat</option>
    <option value="pumpkin">Jack-o'-Lantern</option>
    <option value="breathe">Breathe (your color)</option>
  </select>
</div>

<div>
  <button class="map" onclick="openMapPopup()">Map LEDs</button>
</div>

<!-- ===== BASIC COLORS ===== -->

<div>
  <button class="red" onclick="send('red')">Red</button>
  <button class="green" onclick="send('green')">Green</button>
  <button class="blue" onclick="send('blue')">Blue</button>
</div>

<!-- ===== RAINBOW + SPEED ===== -->

<div class="control-block">
  <button class="rainbow" onclick="send('rainbow')">Rainbow</button>

  <input type="range" id="speed"
         min="1" max="100" value="60"
         oninput="debounceSpeed(this.value)">

  <div style="font-size:35px;margin-top:10px;color:#4CAF50;">
    Animation Speed
  </div>
</div>

<!-- ===== CUSTOM COLOR ===== -->

<div>
  <input type="color" id="picker" value="#ffffff">
  <button class="set" onclick="setColor()">Set Color</button>
</div>

<!-- ===== BRIGHTNESS ===== -->

<div class="control-block">
  <input type="range" id="bright"
         min="1" max="255" value="80"
         oninput="debounceBrightness(this.value)">

  <div style="font-size:35px;margin-top:10px;color:#4CAF50;">
    Brightness
  </div>
</div>

<!-- ===== OFF ===== -->

<div>
  <button class="off" onclick="send('off')">Off</button>
</div>

<!-- ===== FIRMWARE UPDATE ===== -->

<div>
  <button class="update" onclick="updateJacket()">Update Jacket</button>
</div>

<!-- ===== WAVE POPUP ===== -->

<div id="wavePopup">
  <div id="wavePopupInner">
    <h2>Wave Colors</h2>

    <label>Color 1</label>
    <input type="color" id="waveC1" value="#0000ff">

    <label>Color 2</label>
    <input type="color" id="waveC2" value="#ff00ff">

    <div style="margin-top:25px;">
      <button onclick="applyWave()">Apply</button>
      <button onclick="closeWavePopup()">Close</button>
    </div>
  </div>
</div>

<!-- ===== JACK-O'-LANTERN POPUP ===== -->

<div id="pumpkinPopup">
  <div id="pumpkinPopupInner">
    <h2>Jack-o'-Lantern</h2>

    <label>Background Color</label>
    <input type="color" id="pumpkinBg" value="#190600"
           oninput="debounceBackground()" onchange="debounceBackground()">

    <div style="margin-top:25px;">
      <button onclick="closePumpkinPopup()">Done</button>
    </div>
  </div>
</div>

<!-- ===== MAP LEDS POPUP ===== -->

<div id="mapPopup">
  <div id="mapPopupInner">
    <h2>Map LEDs</h2>

    <div>The blinking white light on the jacket is this LED. Add the ones that make the face.</div>

    <div id="ledNumber">LED 0</div>

    <input type="range" id="ledSlider"
           min="0" max="99" value="0"
           oninput="debounceLed(this.value)">

    <div>
      <button onclick="stepLed(-1)">&minus;1</button>
      <button onclick="stepLed(1)">+1</button>
    </div>

    <div>
      <button id="pickButton" class="pick" onclick="togglePick()">Add to face</button>
    </div>

    <div id="faceList">Face: none yet</div>

    <div style="margin-top:15px;">
      <button onclick="clearFace()">Clear face</button>
      <button onclick="finishMapping()">Done</button>
    </div>
  </div>
</div>

<script>
const BASE="https://ethansjacket-production.up.railway.app";
let currentEffect="none";

function send(cmd){
  currentEffect=cmd;
  fetch(`${BASE}/set?cmd=${cmd}`).catch(()=>{});
}

let speedTimeout=null;
function debounceSpeed(val){
  if(speedTimeout)clearTimeout(speedTimeout);
  speedTimeout=setTimeout(()=>{
    fetch(`${BASE}/set?speed=${val}`).catch(()=>{});
  },150);
}

let brightTimeout=null;
function debounceBrightness(val){
  if(brightTimeout)clearTimeout(brightTimeout);
  brightTimeout=setTimeout(()=>{
    fetch(`${BASE}/set?brightness=${val}`).catch(()=>{});
  },150);
}

function setColor(){
  const c=document.getElementById("picker").value.substring(1);
  const r=parseInt(c.substring(0,2),16);
  const g=parseInt(c.substring(2,4),16);
  const b=parseInt(c.substring(4,6),16);
  currentEffect="color";
  fetch(`${BASE}/set?cmd=color&r=${r}&g=${g}&b=${b}`).catch(()=>{});
}

function selectEffect(val){
  if(val==="wave"){
    openWavePopup();
    return;
  }
  if(val==="pumpkin"){
    openPumpkinPopup();
    return;
  }
  currentEffect=val;
  fetch(`${BASE}/set?cmd=${val}`).catch(()=>{});
}

function updateJacket(){
  fetch(`${BASE}/update`).catch(()=>{});
}

function openWavePopup(){
  document.getElementById("wavePopup").style.display="flex";
}

function closeWavePopup(){
  document.getElementById("wavePopup").style.display="none";
}

function applyWave(){
  const c1=document.getElementById("waveC1").value.substring(1);
  const c2=document.getElementById("waveC2").value.substring(1);

  const c1r=parseInt(c1.substring(0,2),16);
  const c1g=parseInt(c1.substring(2,4),16);
  const c1b=parseInt(c1.substring(4,6),16);

  const c2r=parseInt(c2.substring(0,2),16);
  const c2g=parseInt(c2.substring(2,4),16);
  const c2b=parseInt(c2.substring(4,6),16);

  const speed=document.getElementById("speed").value;
  const bright=document.getElementById("bright").value;

  currentEffect="wave";

  const url=
    `${BASE}/set?cmd=wave`+
    `&c1r=${c1r}&c1g=${c1g}&c1b=${c1b}`+
    `&c2r=${c2r}&c2g=${c2g}&c2b=${c2b}`+
    `&speed=${speed}`+
    `&brightness=${bright}`;

  fetch(url).catch(()=>{});
  closeWavePopup();
}

// ===== JACK-O'-LANTERN =====

function openPumpkinPopup(){
  document.getElementById("pumpkinPopup").style.display="flex";
  currentEffect="pumpkin";
  fetch(`${BASE}/set?cmd=pumpkin`).catch(()=>{});

  // start the picker on the background the jacket has now
  fetch(`${BASE}/state`)
    .then(r=>r.json())
    .then(s=>{
      if(s.bgr===undefined) return;
      const hex=[s.bgr,s.bgg,s.bgb].map(n=>n.toString(16).padStart(2,"0")).join("");
      document.getElementById("pumpkinBg").value="#"+hex;
    })
    .catch(()=>{});
}

function closePumpkinPopup(){
  document.getElementById("pumpkinPopup").style.display="none";
}

// the jacket follows the picker live, so you can try colors on it
let bgTimeout=null;
function debounceBackground(){
  if(bgTimeout)clearTimeout(bgTimeout);
  bgTimeout=setTimeout(()=>{
    const c=document.getElementById("pumpkinBg").value.substring(1);
    const r=parseInt(c.substring(0,2),16);
    const g=parseInt(c.substring(2,4),16);
    const b=parseInt(c.substring(4,6),16);
    fetch(`${BASE}/set?bgr=${r}&bgg=${g}&bgb=${b}`).catch(()=>{});
  },150);
}

// ===== MAP LEDS =====
// The face lives on the server, so it survives closing the page.

const LED_COUNT=100;
let currentLed=0;
let face=[];

function openMapPopup(){
  document.getElementById("mapPopup").style.display="flex";
  fetch(`${BASE}/state`)
    .then(r=>r.json())
    .then(s=>{
      face=s.face||[];
      currentLed=s.led||0;
    })
    .catch(()=>{})
    .finally(()=>{
      showLed();
      sendLed();
    });
}

function showLed(){
  document.getElementById("ledNumber").textContent=`LED ${currentLed}`;
  document.getElementById("ledSlider").value=currentLed;
  document.getElementById("pickButton").textContent=
    face.includes(currentLed)?"Remove from face":"Add to face";
  document.getElementById("faceList").textContent=
    face.length?`Face: ${face.join(", ")}`:"Face: none yet";
}

function sendLed(){
  currentEffect="locate";
  fetch(`${BASE}/set?cmd=locate&led=${currentLed}`).catch(()=>{});
}

let ledTimeout=null;
function debounceLed(val){
  currentLed=Number(val);
  showLed();
  if(ledTimeout)clearTimeout(ledTimeout);
  ledTimeout=setTimeout(sendLed,100);
}

function stepLed(d){
  currentLed=Math.min(LED_COUNT-1,Math.max(0,currentLed+d));
  showLed();
  sendLed();
}

function togglePick(){
  if(face.includes(currentLed)) face=face.filter(n=>n!==currentLed);
  else face=[...face,currentLed].sort((a,b)=>a-b);
  showLed();
  fetch(`${BASE}/set?face=${face.join(",")}`).catch(()=>{});
}

function clearFace(){
  if(!confirm("Clear the whole face?")) return;
  face=[];
  showLed();
  fetch(`${BASE}/set?face=`).catch(()=>{});
}

function finishMapping(){
  document.getElementById("mapPopup").style.display="none";
  document.getElementById("effectSelect").value="pumpkin";
  currentEffect="pumpkin";
  fetch(`${BASE}/set?cmd=pumpkin`).catch(()=>{});
}
</script>

</body>
</html>
